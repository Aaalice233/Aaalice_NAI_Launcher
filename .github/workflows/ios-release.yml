name: iOS Release
run-name: iOS unsigned IPA (${{ github.ref_name }})

on:
  # Never runs on a plain push: only a deliberate ios-v* tag or a manual
  # dispatch starts a build.
  # - workflow_dispatch: build the IPA as an Actions artifact only.
  # - ios-v<version>[-<n>] tag: additionally attach the IPA to the existing
  #   upstream release v<version>. The iOS build never creates its own release,
  #   so it can never become the repository's "latest" release.
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.dev"

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    # macos-15 ships Xcode 16.4 by default, which matches the Flutter 3.44.x
    # toolchain and the iOS 16.0 deployment target. macos-latest is pinned
    # here on purpose so a future macos-26/Xcode 26 rollout cannot silently
    # change the SDK under an unsigned-IPA build.
    runs-on: macos-15
    timeout-minutes: 60

    # The attach step uploads the IPA to the matching upstream release.
    permissions:
      contents: write

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report Apple toolchain
        # 纯信息收集：任何一条探针失败都不该掐掉整条流水线
        continue-on-error: true
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Verify official Flutter dependency sources
        shell: pwsh
        run: ./scripts/verify_flutter_sources.ps1

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Generate localizations
        run: flutter gen-l10n

      # Never pass --build-filter here: generated sources are gitignored, so a
      # filtered run would delete every output outside the filter.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release-mode iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          app='build/ios/iphoneos/Runner.app'
          test -d "$app"
          test -s "$app/Runner"

          app_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)"
          if [[ ! "$app_version" =~ ^(.+)\+([0-9]+)$ ]]; then
            echo "Unable to read an iOS version and numeric build number from pubspec.yaml." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"

          # Same naming as the other platforms' release assets, so re-running
          # the attach step replaces the previous IPA instead of piling up files.
          file_name="NAI_Launcher_iOS_${version}+${build_number}_unsigned.ipa"
          rm -rf build/ios/Payload
          mkdir -p build/ios/Payload dist
          cp -R "$app" build/ios/Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Payload "$GITHUB_WORKSPACE/dist/$file_name"
          (cd dist && shasum -a 256 "$file_name" > "$file_name.sha256")

          {
            echo "path=dist/$file_name"
            echo "file_name=$file_name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Report artifact sizes
        shell: bash
        run: |
          set -euo pipefail
          app_size="$(du -sh build/ios/iphoneos/Runner.app | cut -f1)"
          ipa_size="$(du -sh '${{ steps.artifact.outputs.path }}' | cut -f1)"
          {
            echo "## iOS artifact sizes"
            echo
            echo "- build/ios/iphoneos/Runner.app: $app_size"
            echo "- ${{ steps.artifact.outputs.file_name }}: $ipa_size"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NAI-Launcher-iOS-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attach IPA to the matching upstream release
        if: ${{ startsWith(github.ref, 'refs/tags/ios-v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.artifact.outputs.path }}
          IPA_NAME: ${{ steps.artifact.outputs.file_name }}
          APP_VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          # ios-v4.2.1 and ios-v4.2.1-2 (an iOS-only rebuild of the same version)
          # both belong to the upstream release v4.2.1. The tag must match the
          # version in pubspec.yaml, otherwise the IPA would land on the wrong
          # release.
          if [[ "$GITHUB_REF_NAME" != "ios-v${APP_VERSION}" && "$GITHUB_REF_NAME" != "ios-v${APP_VERSION}-"* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $APP_VERSION." >&2
            exit 1
          fi
          target="v${APP_VERSION}"
          # Fail instead of creating a release: iOS only ever joins an existing one.
          gh release view "$target" --json tagName > /dev/null

          gh release upload "$target" "$IPA_PATH" "$IPA_PATH.sha256" --clobber

          gh release view "$target" --json body -q .body > release_body.md
          python3 - "$target" <<'PY'
          import os, re, sys
          from urllib.parse import quote

          target = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          full_sha = os.environ["GITHUB_SHA"]
          sha = full_sha[:7]
          name = os.environ["IPA_NAME"]
          url = f"https://github.com/{repo}/releases/download/{target}/{quote(name)}"
          section = f"""<!-- ios-build:start -->
          ## 📱 iOS

          | OS | Download |
          | --- | --- |
          | **iOS** | [![iOS unsigned IPA](https://img.shields.io/badge/iOS-IPA_unsigned-000000?style=flat-square&logo=apple&logoColor=white)]({url}) |

          - 由 `ios` 分支的 [`{tag}`](https://github.com/{repo}/tree/{tag})（提交 [`{sha}`](https://github.com/{repo}/commit/{full_sha})）构建，版本与本 Release 相同。
          - **未签名**，需要自行签名后侧载。签名工具必须重签 `Payload/Runner.app` 里的每一个嵌套二进制（含 `nai_png_codec.framework`）；保持 Bundle ID `com.aaalice.naiLauncher` 覆盖安装可保留数据。
          - iOS 不支持应用内更新，新版本请回到 Release 页面下载。SHA-256 见同名 `.sha256` 文件（`checksums.txt` 与 `release_manifest.json` 不含 iOS 包）。
          - 与其他平台的差异见 [docs/ios.md](https://github.com/{repo}/blob/ios/docs/ios.md)。
          <!-- ios-build:end -->"""

          with open("release_body.md", encoding="utf-8") as f:
              body = f.read()
          pattern = re.compile(r"<!-- ios-build:start -->.*?<!-- ios-build:end -->", re.S)
          if pattern.search(body):
              body = pattern.sub(lambda _: section, body)
          else:
              body = body.rstrip() + "\n\n" + section + "\n"
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY
          gh release edit "$target" --notes-file release_body.md
