name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/prepare-flutter-build/action.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/pull-request-validation.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-portable.yml"
      - "analysis_options.yaml"
      - "android/**"
      - "assets/**"
      - "build.yaml"
      - "fonts/**"
      - "installer/windows/**"
      - "l10n.yaml"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "scripts/**"
      - "test/**"
      - "tool/**"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.dev"

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      windows_build: ${{ steps.filter.outputs.windows_build }}
      windows_package: ${{ steps.filter.outputs.windows_package }}

    steps:
      - name: Classify pull request files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows_build:
              - '.github/actions/prepare-flutter-build/action.yml'
              - '.github/workflows/pull-request-validation.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/windows-portable.yml'
              - 'assets/**'
              - 'build.yaml'
              - 'fonts/**'
              - 'l10n.yaml'
              - 'lib/**'
              - 'pubspec.lock'
              - 'pubspec.yaml'
              - 'windows/**'
            windows_package:
              - '.github/actions/prepare-flutter-build/action.yml'
              - '.github/workflows/pull-request-validation.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/windows-portable.yml'
              - 'installer/windows/**'
              - 'pubspec.lock'
              - 'pubspec.yaml'
              - 'scripts/package_windows_release.ps1'
              - 'scripts/verify_windows_portable_package.ps1'
              - 'scripts/validate_windows_installer_process_handling.ps1'
              - 'windows/**'

  quality:
    name: Generate, validate, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare incremental Flutter build
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: nai-hosted

      - name: Verify generated files
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze

  test-shards:
    name: Test / ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-and-data
            paths: >-
              test/core,test/data,test/l10n,test/manual,test/tool,test/windows,
              test/app_test.dart,test/first_launch_test.dart,
              test/main_semantics_policy_test.dart,
              test/windows_runner_single_instance_test.dart
          - name: presentation-logic
            paths: >-
              test/presentation/adaptive,test/presentation/agent_chat,
              test/presentation/agent_settings,test/presentation/prompt_assistant,
              test/presentation/providers,test/presentation/services,
              test/presentation/utils,test/presentation/idle_animation_test.dart
          - name: presentation-ui
            paths: >-
              test/presentation/router,test/presentation/screens,
              test/presentation/widgets

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Test Windows portable package verifier
        if: matrix.name == 'core-and-data'
        shell: pwsh
        run: ./scripts/test_windows_portable_package_verifier.ps1

      - name: Prepare incremental Flutter build
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: nai-hosted

      - name: Validate bundled autocomplete databases
        if: matrix.name == 'core-and-data'
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Run tests
        shell: pwsh
        timeout-minutes: 10
        run: >-
          ./scripts/run_flutter_tests.ps1
          -Path "${{ matrix.paths }}"
          -TimeoutSeconds 570

  tests:
    name: Test
    runs-on: ubuntu-latest
    if: always()
    needs: test-shards

    steps:
      - name: Verify all test shards passed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ needs.test-shards.result }}' -ne 'success') {
            throw 'One or more test shards did not pass.'
          }
          Write-Host 'All test shards passed.'

  windows-build:
    name: Build Windows debug
    runs-on: windows-2022
    needs: changes
    if: >-
      github.event_name != 'workflow_dispatch' &&
      needs.changes.outputs.windows_build == 'true' &&
      needs.changes.outputs.windows_package != 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Prepare incremental Flutter build
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: nai-hosted
          cache-windows-build: "true"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Build Windows debug
        run: flutter build windows --debug --no-pub

  windows-package:
    name: Test and package Windows
    runs-on: windows-2022
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.windows_package == 'true'
    timeout-minutes: 40

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Prepare incremental Flutter build
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: nai-hosted
          cache-windows-build: "true"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Validate installer process handling
        shell: pwsh
        run: ./scripts/validate_windows_installer_process_handling.ps1

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim() -replace '\+.*$', ''
          ./scripts/package_windows_release.ps1 `
            -Version $version `
            -SkipFlutterBuild

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $match.Matches[0].Groups[1].Value.Trim() -replace '\+.*$', ''
          $required = @(
            "dist/NAI_Launcher_Windows_${version}_Setup.exe",
            "dist/NAI_Launcher_Windows_${version}_Portable.zip"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing packaged artifact: $path"
            }
          }
          ./scripts/verify_windows_portable_package.ps1 `
            -ArchivePath $required[1] `
            -ExpectedVersion $version

  result:
    name: PR validation
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - quality
      - tests
      - windows-build
      - windows-package

    steps:
      - name: Verify required jobs passed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = '${{ contains(needs.*.result, 'failure') }}' -eq 'true'
          $cancelled = '${{ contains(needs.*.result, 'cancelled') }}' -eq 'true'
          if ($failed -or $cancelled) {
            throw 'One or more pull request validation jobs did not pass.'
          }
          Write-Host 'All required pull request validation jobs passed or were intentionally skipped.'
