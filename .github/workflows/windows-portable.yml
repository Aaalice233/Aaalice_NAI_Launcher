name: Windows portable build
run-name: Windows ${{ inputs.build-mode || 'release' }} portable

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: Flutter build mode
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}-${{ inputs.build-mode || 'release' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.flutter-io.cn"
  BUILD_MODE: ${{ inputs.build-mode || 'release' }}
  BUNDLE_PATH: build/windows/x64/runner/${{ inputs.build-mode == 'debug' && 'Debug' || 'Release' }}

jobs:
  build-windows-portable:
    name: Build Windows ${{ inputs.build-mode || 'release' }} portable
    # This maintainer-dispatched workflow may use a trusted prewarmed runner.
    runs-on: ${{ vars.WINDOWS_FLUTTER_RUNNER || 'windows-2022' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Fingerprint portable build inputs
        id: build-inputs
        shell: pwsh
        run: |
          "fingerprint=${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'l10n.yaml', 'lib/**', 'windows/**', 'assets/**', 'fonts/**') }}" >> $env:GITHUB_OUTPUT

      - name: Restore exact portable bundle
        id: portable-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: nai-portable-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ inputs.build-mode || 'release' }}-${{ steps.build-inputs.outputs.fingerprint }}

      - name: Prepare incremental Flutter build
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-flutter-sdk: ${{ vars.WINDOWS_FLUTTER_SDK_CACHE || 'true' }}
          cache-pub-dependencies: ${{ vars.WINDOWS_PUB_CACHE || 'true' }}
          cache-windows-build: "true"

      - name: Setup NuGet
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        if: steps.portable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Build Windows portable
        if: steps.portable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: flutter build windows --$env:BUILD_MODE --no-pub

      - name: Verify portable bundle
        id: bundle
        shell: pwsh
        run: |
          $bundle = [IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE $env:BUNDLE_PATH)
          )
          $executable = Join-Path $bundle 'nai_launcher.exe'
          if (!(Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Missing portable executable: $executable"
          }
          "bundle-path=$bundle" >> $env:GITHUB_OUTPUT

      - name: Save exact portable bundle
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: nai-portable-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ inputs.build-mode || 'release' }}-${{ steps.build-inputs.outputs.fingerprint }}

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: nai-launcher-windows-${{ inputs.build-mode || 'release' }}-portable
          path: ${{ steps.bundle.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
