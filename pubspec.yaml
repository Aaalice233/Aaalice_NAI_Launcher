name: nai_launcher
description: NovelAI Universal Launcher - 跨平台第三方客户端
publish_to: "none"
version: 4.0.2+41

environment:
  sdk: ">=3.10.7 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # 仅在 ENABLE_FLUTTER_DRIVER 开发标志存在时启用。
  flutter_driver:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 网络请求
  dio: ^5.4.0
  dio_http2_adapter: ^2.3.0
  html: ^0.15.6
  xml: ^6.6.1

  # 图片缓存管理（用于高性能自定义缓存管理器）
  flutter_cache_manager: ^3.3.0

  # Windows 系统代理支持
  win32_registry: ^1.1.3

  # OAuth / 本地安全存储
  flutter_appauth: ^12.0.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # SQLite数据库（画廊索引）
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28

  # 加密库 (Blake2b + Argon2id)
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # SHA 哈希（用于生成唯一ID）

  # ZIP 处理
  archive: ^3.6.1

  # MessagePack 解码（流式 API 响应）
  msgpack_dart: ^1.0.1

  # 图片处理
  image: ^4.1.7

  # 拖拽功能
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1

  # 路由
  go_router: ^14.2.0

  # UI 组件
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.3.3
  emoji_picker_flutter: ^2.1.1
  fl_chart: ^0.68.0
  visibility_detector: ^0.4.0+2

  # 数据模型
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 工具库
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.20.2
  collection: ^1.18.0
  synchronized: ^3.1.0
  dart_sentencepiece_tokenizer: ^1.3.0
  # Qwen tokenizer 在分词前要求 NFC 归一化，Dart 没有内置实现
  unorm_dart: ^0.3.2

  # CSV 解析
  csv: ^6.0.0
  ffi: ^2.1.3

  # 分享功能
  share_plus: ^10.0.0

  # 文件选择
  file_picker: ^8.0.0

  # 日志
  logger: ^2.4.0

  # 窗口管理 (桌面端)
  window_manager: ^0.5.1
  # 屏幕信息（读取工作区，避免窗口超出屏幕；window_manager 的传递依赖，此处提为直接依赖）
  screen_retriever: any
  tray_manager: ^0.2.3

  # 音效
  audioplayers: ^6.0.0

  # 视频播放
  video_player: ^2.8.0
  video_player_media_kit: ^1.0.5
  media_kit_libs_windows_video: any
  media_kit_libs_macos_video: any

  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  flutter_staggered_grid_view: ^0.7.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  timeago: ^3.7.1
  package_info_plus: ^8.0.0

  png_chunks_extract: any

  # 版本号解析
  pub_semver: ^2.1.4
  web_socket_channel: ^3.0.3
  # Maintained ONNX Runtime fork with Android 16 KB pages and emulator ABIs.
  onnxruntime_v2: ^1.23.2+2
  # 3D 编辑器 WebView (Windows=WebView2 / macOS=WKWebView / Android=Chromium)
  flutter_inappwebview: ^6.1.5
  markdown: ^7.3.1
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  # Mock 测试
  mocktail: ^1.0.3
  # 指针设备检测器回归测试直接引用（与 super_drag_and_drop 同版本锁定）
  super_native_extensions: ^0.9.1
  # 文件缓存测试
  file: ^7.0.1
  # 集成测试
  integration_test:
    sdk: flutter
  path_provider_platform_interface: any
  plugin_platform_interface: any
  sqlite3: ^2.9.4
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/data/
    - assets/data/opencc/
    - assets/data/tokenizers/
    - assets/sounds/
    - assets/databases/
    - assets/model3d_editor/
    - assets/model3d_editor/vendor/
    - assets/model3d_editor/vendor/addons/controls/
    - assets/model3d_editor/vendor/addons/loaders/
    - assets/model3d_editor/vendor/addons/utils/

  fonts:
    - family: LXGW ZhenKai GB
      fonts:
        - asset: fonts/LXGWZhenKaiGB-Regular.ttf
    - family: Great Vibes
      fonts:
        - asset: fonts/watermark/GreatVibes-Regular.ttf
    - family: Caveat
      fonts:
        - asset: fonts/watermark/Caveat-VariableFont_wght.ttf
    - family: Allura
      fonts:
        - asset: fonts/watermark/Allura-Regular.ttf
    - family: Ma Shan Zheng
      fonts:
        - asset: fonts/watermark/MaShanZheng-Regular.ttf
    - family: Zhi Mang Xing
      fonts:
        - asset: fonts/watermark/ZhiMangXing-Regular.ttf
    - family: Long Cang
      fonts:
        - asset: fonts/watermark/LongCang-Regular.ttf
